<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mãos em VR</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: system-ui, sans-serif; overflow: hidden; }
  #stage, #handsLayer { position: fixed; inset: 0; display: flex; }
  #handsLayer { pointer-events: none; z-index: 3; }
  canvas { flex: 1; min-width: 0; height: 100%; object-fit: contain; }
  #right, #handR { display: none; }
  .vr #right, .vr #handR { display: block; }
  #stage.mirror canvas, #stage.mirror ~ #handsLayer canvas { transform: scaleX(-1); }
  video { display: none; }
  #ui { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 8px;
    padding: 12px; align-items: center; z-index: 5; }
  button { font: inherit; padding: 10px 14px; border: 0; border-radius: 10px;
    background: #fff; color: #000; }
  #status { margin-left: auto; font-size: 14px; background: #0008;
    padding: 6px 10px; border-radius: 8px; }
  .vr #status { display: none; }
  #tune { display: none; width: 100%; gap: 8px; flex-wrap: wrap; align-items: center; }
  #tune.on { display: flex; }
  #tune span { background: #0008; padding: 6px 10px; border-radius: 8px; font-size: 14px; }

  #wins { position: fixed; inset: 0; display: flex; pointer-events: none; z-index: 2; }
  .win { flex: 1; min-width: 0; position: relative; display: none; overflow: hidden; }
  .win.show { display: block; }
  .win.behind { visibility: hidden; }
  #winR.show { display: none; }
  .vr #winR.show { display: block; }
  .frame { position: absolute; background: #fff; border-radius: 10px; overflow: hidden;
    pointer-events: auto; display: flex; flex-direction: column; transform-origin: center;
    width: 800px; height: 480px; left: 0; top: 0; will-change: transform; }
  .bar { display: flex; gap: 6px; padding: 6px; background: #222; }
  .bar input { flex: 1; min-width: 0; padding: 6px; border-radius: 6px; border: 0; }
  .bar button, .bar a { padding: 6px 10px; font-size: 13px; border-radius: 6px;
    background: #fff; color: #000; text-decoration: none; }
  iframe { flex: 1; border: 0; width: 100%; }
  .frame.grab { box-shadow: 0 0 0 8px #ffd60a; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>

<div id="stage">
  <canvas id="left"></canvas>
  <canvas id="right"></canvas>
</div>

<div id="wins">
  <div class="win" id="winL">
    <div class="frame" id="fL">
      <div class="bar">
        <input id="url" value="https://pt.wikipedia.org">
        <button id="btnGo">Ir</button>
        <a id="btnTab" target="_blank" rel="noopener" href="#">Nova aba</a>
      </div>
      <iframe id="frameL"></iframe>
    </div>
  </div>
  <div class="win" id="winR">
    <div class="frame" id="fR"><iframe id="frameR"></iframe></div>
  </div>
</div>

<div id="handsLayer">
  <canvas id="handL"></canvas>
  <canvas id="handR"></canvas>
</div>

<div id="ui">
  <button id="btnStart">Ligar câmera</button>
  <button id="btnCenter">Recentralizar</button>
  <button id="btnReset">Resetar itens</button>
  <button id="btnFlip">Trocar câmera</button>
  <button id="btnMirror">Espelhar</button>
  <button id="btnSkel">Esqueleto</button>
  <button id="btnVR">Modo VR</button>
  <button id="btnTune">Ajustes</button>
  <span id="status">Aguardando</span>
  <div id="tune">
    <button id="fovM">FOV −</button><button id="fovP">FOV +</button>
    <button id="lagM">Atraso −</button><button id="lagP">Atraso +</button>
    <span id="tuneInfo"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js"></script>
<script>
/* ===== Ajustes ===== */
let FOV_LONG = 65;        // campo de visão (graus) do lado maior da câmera (ajustável pelo botão Ajustes)
let lagAdj = 20;          // ajuste manual (ms) somado ao atraso medido da câmera
const LAG_FALLBACK = 70;  // atraso usado se o navegador não informar o atraso real
const HAND_DARK = 0.5;    // quanto a mão escurece ao tocar num item
const ITEM_SEE = 0.5;     // quanto o item fica transparente onde a mão toca
const TB_PITCH = -15;     // altura da barra de tarefas (graus abaixo do centro)
const WIN_PITCH = 4;      // altura do centro da janela
const WIN_HALF_W = 20;    // meia-largura da janela (graus)
const ICON_GAP = 3.2;     // distância dos ícones ao centro (graus)
const MASK_WIDTH = 0.24;  // espessura do recorte da mão (menor = mais justo)
const STILL_CUTOFF = 0.5; // Hz: menor = item mais travado quando parado (mais lento a "assentar")
const SPEED_BETA = 0.09;  // maior = acompanha mais rápido quando você gira
const DEADZONE_DEG = 0.25;// tremor menor que isso (graus) é ignorado quando parado

const $ = id => document.getElementById(id);
const video = $('video'), left = $('left'), right = $('right');
const handL = $('handL'), handR = $('handR');
const lctx = left.getContext('2d', { alpha: false }), rctx = right.getContext('2d', { alpha: false });
const hctx = handL.getContext('2d'), hrctx = handR.getContext('2d');
const stage = $('stage'), statusEl = $('status');
const winL = $('winL'), winR = $('winR'), fL = $('fL'), fR = $('fR');
const frameL = $('frameL'), frameR = $('frameR'), urlInput = $('url'), btnTab = $('btnTab');

let facing = 'environment', stream = null, started = false;
let browserOpen = false, lastClick = 0, showSkel = false;
let lastHands = [], lagAuto = null, rvfcOn = false;

/* ===== Giroscópio (quaternions + histórico para compensar o atraso do vídeo) ===== */
const rad = d => d * Math.PI / 180;
const qmul = (a, b) => ({
  w: a.w*b.w - a.x*b.x - a.y*b.y - a.z*b.z,
  x: a.w*b.x + a.x*b.w + a.y*b.z - a.z*b.y,
  y: a.w*b.y - a.x*b.z + a.y*b.w + a.z*b.x,
  z: a.w*b.z + a.x*b.y - a.y*b.x + a.z*b.w });
function eulerToQ(aDeg, bDeg, gDeg) {
  const a = rad(aDeg)/2, b = rad(bDeg)/2, g = rad(gDeg)/2;
  const qz = { w: Math.cos(a), x: 0, y: 0, z: Math.sin(a) };
  const qx = { w: Math.cos(b), x: Math.sin(b), y: 0, z: 0 };
  const qy = { w: Math.cos(g), x: 0, y: Math.sin(g), z: 0 };
  return qmul(qmul(qz, qx), qy);
}
function nlerp(p, q, t) {
  let d = p.w*q.w + p.x*q.x + p.y*q.y + p.z*q.z;
  const s = d < 0 ? -1 : 1;
  const r = { w: p.w + (s*q.w - p.w)*t, x: p.x + (s*q.x - p.x)*t,
              y: p.y + (s*q.y - p.y)*t, z: p.z + (s*q.z - p.z)*t };
  const n = Math.hypot(r.w, r.x, r.y, r.z) || 1;
  return { w: r.w/n, x: r.x/n, y: r.y/n, z: r.z/n };
}
function qToR(q) {
  const { w, x, y, z } = q;
  return [1-2*(y*y+z*z), 2*(x*y-w*z), 2*(x*z+w*y),
          2*(x*y+w*z), 1-2*(x*x+z*z), 2*(y*z-w*x),
          2*(x*z-w*y), 2*(y*z+w*x), 1-2*(x*x+y*y)];
}
let gyroOK = false, gyroAdded = false, anchor = null, curR = qToR(eulerToQ(0, 90, 0));
let hist = [];                         // [{t, q}]
let prevTarget = eulerToQ(0, 90, 0), speedDeg = 0, lastPoseT = performance.now();
let qShown = eulerToQ(0, 90, 0);       // padrão: celular em pé olhando para o horizonte

function pushOrientation(e) {
  if (e.alpha == null) return;
  hist.push({ t: performance.now(), q: eulerToQ(e.alpha, e.beta, e.gamma) });
  if (hist.length > 90) hist.shift();
  if (!gyroOK) { gyroOK = true; updatePose(true); recenter(); }
}
function updatePose(snap) {
  if (!hist.length) { curR = qToR(qShown); return; }
  const T = performance.now() - ((lagAuto ?? LAG_FALLBACK) + lagAdj);
  let target = hist[0].q;
  for (let i = hist.length - 1; i >= 0; i--) {
    if (hist[i].t <= T) {
      const n = hist[i + 1];
      target = n ? nlerp(hist[i].q, n.q, (T - hist[i].t) / Math.max(1, n.t - hist[i].t)) : hist[i].q;
      break;
    }
  }
  const now = performance.now();
  if (snap) { qShown = target; prevTarget = target; speedDeg = 0; lastPoseT = now; }
  else {
    // Filtro "One Euro": parado = muito suave (item travado no lugar); girando = quase sem atraso
    const dt = Math.max(0.004, Math.min(0.1, (now - lastPoseT) / 1000));
    lastPoseT = now;
    const angOf = (p, q) => 2 * Math.acos(Math.min(1, Math.abs(p.w*q.w + p.x*q.x + p.y*q.y + p.z*q.z)));
    const rawSpeed = (angOf(prevTarget, target) * 180 / Math.PI) / dt;   // graus/s do sensor
    prevTarget = target;
    speedDeg += (rawSpeed - speedDeg) * 0.15;                            // velocidade já suavizada
    const cutoff = STILL_CUTOFF + SPEED_BETA * speedDeg;                 // Hz
    let alpha = 1 / (1 + (1 / (2 * Math.PI * cutoff)) / dt);
    // zona morta: diferença minúscula em relação ao que já aparece é ignorada (some o tremor residual)
    const err = angOf(qShown, target) * 180 / Math.PI;
    if (err < DEADZONE_DEG && speedDeg < 4) alpha *= err / DEADZONE_DEG;
    qShown = nlerp(qShown, target, alpha);
  }
  curR = qToR(qShown);
}
function screenAngle() {
  const a = (screen.orientation && screen.orientation.angle != null)
    ? screen.orientation.angle : (window.orientation || 0);
  return rad(((a % 360) + 360) % 360);
}
function camAxes() {
  const t = screenAngle();
  const sr = [Math.cos(t), -Math.sin(t), 0];
  const su = [Math.sin(t),  Math.cos(t), 0];
  const rear = facing === 'environment';
  return { fwd: rear ? [0, 0, -1] : [0, 0, 1], right: rear ? sr : sr.map(v => -v), up: su };
}
function recenter() {
  updatePose(true);
  const R = curR, ax = camAxes();
  const f = [R[0]*ax.fwd[0] + R[1]*ax.fwd[1] + R[2]*ax.fwd[2],
             R[3]*ax.fwd[0] + R[4]*ax.fwd[1] + R[5]*ax.fwd[2],
             R[6]*ax.fwd[0] + R[7]*ax.fwd[1] + R[8]*ax.fwd[2]];
  const pitch = Math.asin(Math.max(-1, Math.min(1, f[2])));
  anchor = { yaw: Math.atan2(f[0], f[1]), pitch: Math.max(rad(-30), Math.min(rad(30), pitch)) };
}
function dirAt(dyawDeg, dpitchDeg) {
  const y = anchor.yaw + rad(dyawDeg), p = anchor.pitch + rad(dpitchDeg);
  return [Math.cos(p)*Math.sin(y), Math.cos(p)*Math.cos(y), Math.sin(p)];
}
function proj(w3) {
  const R = curR, ax = camAxes();
  const v = [R[0]*w3[0] + R[3]*w3[1] + R[6]*w3[2],
             R[1]*w3[0] + R[4]*w3[1] + R[7]*w3[2],
             R[2]*w3[0] + R[5]*w3[1] + R[8]*w3[2]];
  const dot = (p, q) => p[0]*q[0] + p[1]*q[1] + p[2]*q[2];
  const depth = dot(v, ax.fwd);
  const W = left.width, H = left.height;
  const f = (Math.max(W, H) / 2) / Math.tan(rad(FOV_LONG / 2));
  if (depth <= 0.05) return { ok: false, x: 0, y: 0 };
  return { ok: true, x: W/2 + f * dot(v, ax.right) / depth, y: H/2 - f * dot(v, ax.up) / depth };
}
async function enableGyro() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    }
  } catch (e) { return; }
  if (gyroAdded) return;
  gyroAdded = true;
  window.addEventListener('deviceorientation', pushOrientation, true);
}

/* ===== Navegador dentro da tela ===== */
function go(u) {
  u = (u || '').trim(); if (!u) return;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  frameL.src = u; frameR.src = u; urlInput.value = u; btnTab.href = u;
}
function openBrowser() {
  browserOpen = true;
  winL.classList.add('show'); winR.classList.add('show');
  if (!frameL.getAttribute('src')) go(urlInput.value);
}
function closeBrowser() {
  browserOpen = false;
  winL.classList.remove('show'); winR.classList.remove('show');
}
$('btnGo').onclick = () => go(urlInput.value);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') go(urlInput.value); });

function toCss(win, x, y) {
  const W = left.width, H = left.height, bw = win.clientWidth, bh = win.clientHeight;
  const s = Math.min(bw / W, bh / H);
  const ox = (bw - W * s) / 2, oy = (bh - H * s) / 2;
  const xx = stage.classList.contains('mirror') ? W - x : x;
  return { x: ox + xx * s, y: oy + y * s };
}
function placeFrame(win, fr) {
  if (!win.classList.contains('show')) return;
  const c = proj(dirAt(winPos.yaw, winPos.pitch)), e = proj(dirAt(winPos.yaw + WIN_HALF_W, winPos.pitch));
  if (!c.ok || !e.ok) { win.classList.add('behind'); return; }
  win.classList.remove('behind');
  const cc = toCss(win, c.x, c.y), ee = toCss(win, e.x, e.y);
  let dx = ee.x - cc.x, dy = ee.y - cc.y;
  const hw = Math.hypot(dx, dy);
  if (dx < 0) { dx = -dx; dy = -dy; }
  const sc = (2 * hw) / 800;
  fr.style.transform = `translate3d(${cc.x - 400}px, ${cc.y - 240}px, 0) rotate(${Math.atan2(dy, dx)}rad) scale(${sc})`;
}

/* ===== Barra de tarefas ===== */
const icons = [ { id: 'chrome', dyaw: -ICON_GAP }, { id: 'close', dyaw: ICON_GAP } ];

/* ===== Reposicionar itens: pinça (polegar + indicador) sobre a barra ou a janela e arraste ===== */
const tbPos = { yaw: 0, pitch: TB_PITCH }, winPos = { yaw: 0, pitch: WIN_PITCH };   // graus, relativos ao centro
let drag = null;
const prevPinch = [];
const POS_KEY = 'maosvr.pos';
function savePos() {
  try { localStorage.setItem(POS_KEY, JSON.stringify({ tb: tbPos, win: winPos })); } catch (e) {}
}
function loadPos() {
  try {
    const s = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
    if (s && s.tb && s.win) { Object.assign(tbPos, s.tb); Object.assign(winPos, s.win); }
  } catch (e) {}
}
function resetPos() {
  tbPos.yaw = 0; tbPos.pitch = TB_PITCH; winPos.yaw = 0; winPos.pitch = WIN_PITCH; savePos();
}
loadPos();

// ponto da tela (pixels do vídeo) -> direção em graus relativa ao centro (inverso de proj)
function angAt(x, y) {
  const W = left.width, H = left.height, ax = camAxes(), R = curR;
  const f = (Math.max(W, H) / 2) / Math.tan(rad(FOV_LONG / 2));
  const a = (x - W / 2) / f, b = -(y - H / 2) / f;
  const v = [0, 1, 2].map(i => ax.fwd[i] + ax.right[i] * a + ax.up[i] * b);
  const wv = [R[0]*v[0] + R[1]*v[1] + R[2]*v[2],
              R[3]*v[0] + R[4]*v[1] + R[5]*v[2],
              R[6]*v[0] + R[7]*v[1] + R[8]*v[2]];
  const n = Math.hypot(wv[0], wv[1], wv[2]) || 1;
  let dy = Math.atan2(wv[0], wv[1]) - anchor.yaw;
  dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  return { yaw: dy * 180 / Math.PI, pitch: (Math.asin(Math.max(-1, Math.min(1, wv[2] / n))) - anchor.pitch) * 180 / Math.PI };
}
function hitItem(pos, r, x, y) {
  if (browserOpen) {   // janela primeiro (fica por cima)
    const c = proj(dirAt(winPos.yaw, winPos.pitch)), e = proj(dirAt(winPos.yaw + WIN_HALF_W, winPos.pitch));
    if (c.ok && e.ok) {
      const hw = Math.hypot(e.x - c.x, e.y - c.y), ang = Math.atan2(e.y - c.y, e.x - c.x);
      const dx = x - c.x, dy = y - c.y;
      const lx = dx * Math.cos(ang) + dy * Math.sin(ang), ly = -dx * Math.sin(ang) + dy * Math.cos(ang);
      if (Math.abs(lx) < hw && Math.abs(ly) < hw * 0.6) return 'win';
    }
  }
  if (pos[0].ok && pos[1].ok) {
    const mx = (pos[0].x + pos[1].x) / 2, my = (pos[0].y + pos[1].y) / 2;
    const ang = Math.atan2(pos[1].y - pos[0].y, pos[1].x - pos[0].x);
    const bw = Math.hypot(pos[1].x - pos[0].x, pos[1].y - pos[0].y) + r * 3.2, bh = r * 2.7;
    const dx = x - mx, dy = y - my;
    const lx = dx * Math.cos(ang) + dy * Math.sin(ang), ly = -dx * Math.sin(ang) + dy * Math.cos(ang);
    if (Math.abs(lx) < bw / 2 && Math.abs(ly) < bh / 2) return 'tb';
  }
  return null;
}
function startDrag(it, hand, x, y) {
  const item = it === 'win' ? winPos : tbPos, p = angAt(x, y);
  drag = { it, hand, item, offY: p.yaw - item.yaw, offP: p.pitch - item.pitch, fy: p.yaw, fp: p.pitch, lastSeen: performance.now() };
  if (it === 'win') { fL.classList.add('grab'); fR.classList.add('grab'); }
}
function moveDrag(x, y) {
  const p = angAt(x, y);
  drag.fy += (p.yaw - drag.fy) * 0.45;      // suaviza o tremor da mão enquanto arrasta
  drag.fp += (p.pitch - drag.fp) * 0.45;
  drag.item.yaw = drag.fy - drag.offY;
  drag.item.pitch = Math.max(-60, Math.min(60, drag.fp - drag.offP));
}
function endDrag() {
  fL.classList.remove('grab'); fR.classList.remove('grab');
  drag = null; savePos();
}

function drawChrome(c, x, y, r) {
  const cols = ['#ea4335', '#fbbc05', '#34a853'];
  for (let i = 0; i < 3; i++) {
    c.beginPath(); c.moveTo(x, y);
    c.arc(x, y, r, -Math.PI/2 + i*2*Math.PI/3, -Math.PI/2 + (i+1)*2*Math.PI/3);
    c.closePath(); c.fillStyle = cols[i]; c.fill();
  }
  c.beginPath(); c.arc(x, y, r*0.5, 0, 7); c.fillStyle = '#fff'; c.fill();
  c.beginPath(); c.arc(x, y, r*0.38, 0, 7); c.fillStyle = '#4285f4'; c.fill();
}
function drawTaskbar(c, pos, r, hoverId) {
  if (!pos[0].ok || !pos[1].ok) return;
  const mx = (pos[0].x + pos[1].x) / 2, my = (pos[0].y + pos[1].y) / 2;
  const ang = Math.atan2(pos[1].y - pos[0].y, pos[1].x - pos[0].x);
  const bw = Math.hypot(pos[1].x - pos[0].x, pos[1].y - pos[0].y) + r * 3.2, bh = r * 2.7, k = bh / 3;
  c.save(); c.translate(mx, my); c.rotate(ang);
  c.fillStyle = (drag && drag.it === 'tb') ? 'rgba(70,70,110,0.92)' : 'rgba(20,20,30,0.75)';
  c.beginPath();
  c.moveTo(-bw/2 + k, -bh/2);
  c.arcTo(bw/2, -bh/2, bw/2, bh/2, k); c.arcTo(bw/2, bh/2, -bw/2, bh/2, k);
  c.arcTo(-bw/2, bh/2, -bw/2, -bh/2, k); c.arcTo(-bw/2, -bh/2, bw/2, -bh/2, k);
  c.closePath(); c.fill(); c.restore();
  icons.forEach((ic, i) => {
    const p = pos[i];
    if (ic.id === 'close' && !browserOpen) c.globalAlpha = 0.3;
    if (hoverId === ic.id) {
      c.fillStyle = 'rgba(255,255,255,0.3)';
      c.beginPath(); c.arc(p.x, p.y, r * 1.3, 0, 7); c.fill();
    }
    if (ic.id === 'chrome') drawChrome(c, p.x, p.y, r);
    else {
      c.strokeStyle = '#fff'; c.lineWidth = 4; c.lineCap = 'round';
      c.beginPath();
      c.moveTo(p.x - r*.5, p.y - r*.5); c.lineTo(p.x + r*.5, p.y + r*.5);
      c.moveTo(p.x + r*.5, p.y - r*.5); c.lineTo(p.x - r*.5, p.y + r*.5);
      c.stroke();
    }
    c.globalAlpha = 1;
  });
}
function press(id) {
  const now = Date.now();
  if (now - lastClick < 800) return;
  lastClick = now;
  if (id === 'chrome') openBrowser();
  if (id === 'close') closeBrowser();
}

/* ===== Máscara dos itens (barra e janela) para o efeito de toque ===== */
const maskCv = document.createElement('canvas'), mctx = maskCv.getContext('2d');
function rrect(c, bw, bh, k) {
  c.beginPath(); c.moveTo(-bw/2 + k, -bh/2);
  c.arcTo(bw/2, -bh/2, bw/2, bh/2, k); c.arcTo(bw/2, bh/2, -bw/2, bh/2, k);
  c.arcTo(-bw/2, bh/2, -bw/2, -bh/2, k); c.arcTo(-bw/2, -bh/2, bw/2, -bh/2, k);
  c.closePath();
}
function drawItemMask(pos, r, w, h) {
  mctx.clearRect(0, 0, w, h); mctx.fillStyle = '#000';
  if (pos[0].ok && pos[1].ok) {
    const bw = Math.hypot(pos[1].x - pos[0].x, pos[1].y - pos[0].y) + r * 3.2, bh = r * 2.7;
    mctx.save();
    mctx.translate((pos[0].x + pos[1].x) / 2, (pos[0].y + pos[1].y) / 2);
    mctx.rotate(Math.atan2(pos[1].y - pos[0].y, pos[1].x - pos[0].x));
    rrect(mctx, bw, bh, bh / 3); mctx.fill(); mctx.restore();
  }
  if (browserOpen) {
    const c = proj(dirAt(winPos.yaw, winPos.pitch)), e = proj(dirAt(winPos.yaw + WIN_HALF_W, winPos.pitch));
    if (c.ok && e.ok) {
      const hw = Math.hypot(e.x - c.x, e.y - c.y);
      mctx.save(); mctx.translate(c.x, c.y); mctx.rotate(Math.atan2(e.y - c.y, e.x - c.x));
      rrect(mctx, hw * 2, hw * 1.2, 10); mctx.fill(); mctx.restore();
    }
  }
}

/* ===== Mão por cima: recorta a mão do vídeo atual ===== */
function drawHandCutout(hands, w, h) {
  hctx.clearRect(0, 0, w, h);
  if (!hands.length) return;
  hctx.globalCompositeOperation = 'source-over';
  hctx.fillStyle = '#fff'; hctx.strokeStyle = '#fff';
  hctx.lineJoin = 'round'; hctx.lineCap = 'round';
  for (const lm of hands) {
    const P = i => [lm[i].x * w, lm[i].y * h];
    const size = Math.hypot((lm[0].x - lm[9].x) * w, (lm[0].y - lm[9].y) * h);
    hctx.lineWidth = size * MASK_WIDTH;
    hctx.beginPath();
    for (const [i, j] of HAND_CONNECTIONS) {
      const a = P(i), b = P(j); hctx.moveTo(a[0], a[1]); hctx.lineTo(b[0], b[1]);
    }
    hctx.stroke();
    hctx.beginPath();
    [0, 1, 5, 9, 13, 17].forEach((i, k) => { const p = P(i); k ? hctx.lineTo(p[0], p[1]) : hctx.moveTo(p[0], p[1]); });
    hctx.closePath(); hctx.fill();
  }
  hctx.globalCompositeOperation = 'source-in';
  hctx.drawImage(video, 0, 0, w, h);
  hctx.globalCompositeOperation = 'source-over';
}

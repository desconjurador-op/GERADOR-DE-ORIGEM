<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mãos em VR</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; }
  canvas { flex: 1; min-width: 0; height: 100%; object-fit: contain; }
  #right { display: none; }
  .vr #right { display: block; }
  .mirror canvas { transform: scaleX(-1); }
  video { display: none; }
  #ui { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px;
    padding: 12px; align-items: center; z-index: 2; }
  button { font: inherit; padding: 10px 14px; border: 0; border-radius: 10px;
    background: #fff; color: #000; }
  #status { margin-left: auto; font-size: 14px; background: #0008;
    padding: 6px 10px; border-radius: 8px; }
  .vr #status { display: none; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<div id="stage">
  <canvas id="left"></canvas>
  <canvas id="right"></canvas>
</div>
<div id="ui">
  <button id="btnStart">Ligar câmera</button>
  <button id="btnFlip">Trocar câmera</button>
  <button id="btnVR">Modo VR</button>
  <span id="status">Aguardando</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js"></script>
<script>
const video = document.getElementById('video');
const left = document.getElementById('left');
const right = document.getElementById('right');
const lctx = left.getContext('2d');
const rctx = right.getContext('2d');
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');

let facing = 'environment';   // câmera traseira
let stream = null;
let looping = false;

// Bola virtual que você pode pegar com o gesto de pinça
const ball = { x: 0.5, y: 0.5, r: 0.07, held: false };

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (!window.isSecureContext || !navigator.mediaDevices) {
    statusEl.textContent = 'Página sem HTTPS (endereço: ' + location.protocol + '). Abra por um link https://';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
  } catch (e) {
    const msgs = {
      NotAllowedError: 'Permissão negada. Libere a câmera nas configurações do site/navegador.',
      NotFoundError: 'Nenhuma câmera encontrada.',
      NotReadableError: 'Câmera em uso por outro app. Feche os outros apps e tente de novo.',
      OverconstrainedError: 'Essa câmera não está disponível. Toque em "Trocar câmera".'
    };
    statusEl.textContent = msgs[e.name] || ('Erro: ' + e.name);
    return;
  }
  video.srcObject = stream;
  await video.play();
  left.width = right.width = video.videoWidth;
  left.height = right.height = video.videoHeight;
  stage.classList.toggle('mirror', facing === 'user');
  statusEl.textContent = 'Câmera ligada';
  if (!looping) { looping = true; loop(); }
}

// Configuração do MediaPipe Hands
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
});
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 0,           // 0 = mais leve, melhor para celular
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.5
});
hands.onResults(onResults);

async function loop() {
  if (video.readyState >= 2) await hands.send({ image: video });
  requestAnimationFrame(loop);
}

function onResults(results) {
  const w = left.width, h = left.height;
  lctx.save();
  lctx.drawImage(video, 0, 0, w, h);

  let pinching = false;
  const found = results.multiHandLandmarks || [];

  for (const lm of found) {
    drawConnectors(lctx, lm, HAND_CONNECTIONS, { color: '#00e5ff', lineWidth: 3 });
    drawLandmarks(lctx, lm, { color: '#ff3d71', lineWidth: 1, radius: 3 });

    // Gesto de pinça: distância entre a ponta do polegar (4) e do indicador (8)
    const a = lm[4], b = lm[8];
    const dist = Math.hypot((a.x - b.x) * w, (a.y - b.y) * h) / w;
    if (dist < 0.05) {
      const px = (a.x + b.x) / 2, py = (a.y + b.y) / 2;
      const nearBall = Math.hypot((px - ball.x) * w, (py - ball.y) * h) / w < ball.r * 1.5;
      if (ball.held || nearBall) {
        ball.held = true;
        ball.x = px; ball.y = py;
      }
      pinching = true;
    }
  }
  if (!pinching) ball.held = false;

  // Desenha a bola
  lctx.beginPath();
  lctx.arc(ball.x * w, ball.y * h, ball.r * w, 0, Math.PI * 2);
  lctx.fillStyle = ball.held ? '#ffd60a' : '#7c4dff';
  lctx.fill();
  lctx.restore();

  // Copia a imagem para o segundo olho (modo VR)
  if (stage.classList.contains('vr')) rctx.drawImage(left, 0, 0);

  statusEl.textContent = found.length
    ? `${found.length} mão(s)${pinching ? ' · pinça' : ''}`
    : 'Nenhuma mão detectada';
}

document.getElementById('btnStart').onclick = startCamera;
document.getElementById('btnFlip').onclick = () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) startCamera();
};
document.getElementById('btnVR').onclick = async () => {
  stage.classList.toggle('vr');
  document.body.classList.toggle('vr');
  if (stage.classList.contains('vr') && document.documentElement.requestFullscreen) {
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
  }
};
</script>
</body>
</html>
